services:
  mongodb:
    image: mongo:latest
    container_name: superheroes_db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build: .
    container_name: superheroes_backend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - MONGO_URI=mongodb://mongodb:27017/superheroes
    depends_on:
      - mongodb

volumes:
  mongo_data:
